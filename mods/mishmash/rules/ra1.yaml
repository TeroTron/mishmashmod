
#######################################
# RA1 Allied MCV
#######################################

ra1alliedconst:
	Inherits: ^ConstructionYard
	Buildable:
		BuildPaletteOrder: 20
	ProvidesPrerequisite@buildingname:
		Prerequisite: ra1alliedconst
	Production:
		Produces: Building.ra1allied, Support.ra1allied
	Building:
		Footprint: xxxx xxxx xxxx xxxx 
		Dimensions: 4, 4
	Tooltip:
		Name: Construction Yard
	Tooltip@NoRow:
		Name: Construction Yard
	ProductionQueue@Building:
		Type: Building.ra1allied
		DisplayOrder: 2
		Factions: ra1allied
	ProductionQueue@Support:
		Type: Support.ra1allied
		DisplayOrder: 6
		Factions: ra1allied
	ProductionBar@Building:
		ProductionType: Building.ra1allied
	ProductionBar@Support:
		ProductionType: Support.ra1allied
		Color: 8A8A8A
	StoresPlayerResources:
		Capacity: 1000000
	Transforms:
		IntoActor: ra1alliedmcv
	WithIdleOverlay@crane:
		Sequence: idle-crane
		PauseOnCondition: disabled || chrora1alliedisable
		RequiresCondition: !build-incomplete
	IsometricSelectable:
		DecorationHeight: 90
	WithIdleOverlay@flags:
		Sequence: idle-flags
		PauseOnCondition: chrora1alliedisable
		RequiresCondition: !build-incomplete
	Voiced:
		VoiceSet: SovietConstructionYardVoice
	RenderSprites:
		Image: ra1alliedconst

ra1alliedmcv:
	Inherits: ^ConstructionVehicle
	Buildable:
		Queue: Vehicle.Shared, Vehicle.ra1allied
		Prerequisites: ~vehicle.ra1allied, ~techlevel.2, ~!global-suddendeath, ~!ai.mcv
	Transforms:
		IntoActor: ra1alliedconst
	Voiced:
		VoiceSet: AlliedConstructionVehicleVoice
	RenderVoxels
		Image: ra1alliedmcv
		Scale: 12.0
		LightAmbientColor: 0.6, 0.6, 0.6
		LightDiffuseColor: 0.4, 0.4, 0.4
		LightPitch: 142
		LightYaw: 682
	RenderSprites:
		Image: ra1alliedmcv

